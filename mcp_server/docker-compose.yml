version: '3.8'

services:
  mcp-server:
    build: .
    container_name: mcp-robot-server
    ports:
      - "8000:8000"
    environment:
      - ROBOT_BRIDGE_URL=http://host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - robot-net

networks:
  robot-net:
    driver: bridge
